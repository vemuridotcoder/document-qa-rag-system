name: ci-cd

on:
  push:
    branches: ["main", "work"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Static compile check
        run: python -m compileall api src
      - name: Unit + integration tests
        run: pytest -q
      - name: Regression gate (optional artifacts)
        run: |
          if [ -f evaluation/retrieval_results.json ] && [ -f evaluation/latency_benchmark.json ]; then
            python src/regression_gate.py
          else
            echo "Skipping regression gate: artifacts missing"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t document-qa-rag-system:${{ github.sha }} .
